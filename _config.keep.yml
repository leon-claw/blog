# Theme Keep configuration
# Docs: https://keep-docs.xpoet.cn

# Separate from the theme's _config.yml, so theme upgrades won't lose your settings
base_info:
  title: Leon's Blog
  author: Leon
  avatar: /images/avatar.svg
  logo: /images/logo.svg
  favicon: /images/logo.svg

menu:
  home: /
  archives: /archives
  tags: /tags
  # categories: /categories
  # about: /about

# 首屏：全屏背景 + 金句打字机
# - 背景动效来自官方 SVG 素材（light: climbed.svg / dark: put.svg），逐云飘动生长动画
# - 金句优先从「一言」API 每次随机（custom_hitokoto，由 relay-typewriter.js 接管）
#   请求失败/超时 4s 后回退到下面的 description 本地文案
#   （不开启主题自带的 hitokoto: true，那个有 400ms 竞态且与自定义脚本冲突）
first_screen:
  enable: true
  background_img: /images/bg/light.svg
  background_img_dark: /images/bg/dark.svg
  description: >-
    黄色的森林里分出两条路，可惜我不能同时去涉足，
    而我选择了人迹更少的那一条，从此决定了我一生的道路。
  hitokoto: false
  custom_hitokoto: true

social_contact:
  enable: true
  links:
    github: https://github.com/yourname
    email: you@example.com

scroll:
  progress_bar: true
  percent: true
  hide_header: true

home:
  announcement:
  category: true
  tag: true
  post_datetime: updated

post:
  word_count:
    wordcount: true
    min2read: true

# 注入自定义脚本（首屏接力打字机）
inject:
  enable: true
  js:
    - /custom/js/relay-typewriter.js
